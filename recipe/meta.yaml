{% set name = "pytest-pretty" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 97e9921be40f003e40ae78db078d4a0c1ea42bf73418097b5077970c2cc43bf3

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - pytest >=7
    - rich >=12

test:
  source_files:
    - tests
  imports:
    - pytest_pretty
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/samuelcolvin/pytest-pretty
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pytest plugin for pretty printing the test summary.
  description: Pytest plugin for pretty printing the test summary.
  dev_url: https://github.com/samuelcolvin/pytest-pretty
  doc_url: https://github.com/samuelcolvin/pytest-pretty

extra:
  recipe-maintainers:
    - thewchan
